<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoAgent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="会话侧栏">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 3.2c4.9 0 8.9 3.5 8.9 7.9 0 2.7-1.5 5.1-3.8 6.5l.6 3.2-3.4-1.8c-.7.1-1.5.2-2.3.2-4.9 0-8.9-3.5-8.9-8S7.1 3.2 12 3.2Z" />
              <path d="M8.5 10.4h.1M12 10.4h.1M15.5 10.4h.1" />
            </svg>
          </div>
          <div>
            <h1>EmoAgent</h1>
            <p>情绪聊天助手</p>
          </div>
        </div>

        <button class="new-chat" id="newChatButton" type="button">
          <span aria-hidden="true">+</span>
          新会话
        </button>

        <section class="status-panel" aria-label="服务状态">
          <div>
            <span class="eyebrow">后端服务</span>
            <strong id="serviceStatus">未连接</strong>
          </div>
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        </section>

        <section class="settings" aria-label="接口设置">
          <label for="apiBaseInput">API 地址</label>
          <div class="setting-row">
            <input id="apiBaseInput" autocomplete="off" spellcheck="false" />
            <button id="saveApiButton" type="button" aria-label="保存 API 地址">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
                <path d="M17 21v-8H7v8M7 3v5h8" />
              </svg>
            </button>
          </div>
        </section>
      </aside>

      <section class="chat-panel" aria-label="聊天区域">
        <header class="chat-header">
          <div>
            <span class="eyebrow">当前会话</span>
            <h2 id="conversationTitle">开始一次情绪对话</h2>
          </div>
          <div class="conversation-id" id="conversationIdLabel">尚未创建</div>
        </header>

        <div class="message-list" id="messageList" aria-live="polite">
          <article class="message assistant">
            <div class="avatar" aria-hidden="true">E</div>
            <div class="bubble">
              <p>你好，我会先理解你的情绪，再给出更贴近当下状态的回应。把想说的话发给我就好。</p>
            </div>
          </article>
        </div>

        <form class="composer" id="chatForm">
          <textarea
            id="messageInput"
            rows="1"
            maxlength="2000"
            placeholder="输入你现在想说的话..."
            aria-label="聊天输入"
          ></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送消息">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4 20-7Z" />
              <path d="M22 2 11 13" />
            </svg>
          </button>
        </form>
      </section>

      <aside class="insight-panel" aria-label="情绪洞察">
        <div class="panel-heading">
          <span class="eyebrow">实时分析</span>
          <h2>情绪洞察</h2>
        </div>

        <section class="emotion-card">
          <div class="emotion-topline">
            <span id="primaryEmotion">等待输入</span>
            <strong id="emotionIntensity">--</strong>
          </div>
          <div class="meter" aria-hidden="true">
            <span id="emotionMeter"></span>
          </div>
          <p id="emotionMeta">发送消息后会展示情绪、强度和置信度。</p>
        </section>

        <section class="insight-grid">
          <div>
            <span>次级情绪</span>
            <strong id="secondaryEmotion">--</strong>
          </div>
          <div>
            <span>置信度</span>
            <strong id="confidenceValue">--</strong>
          </div>
          <div>
            <span>反讽</span>
            <strong id="sarcasmValue">--</strong>
          </div>
          <div>
            <span>混合情绪</span>
            <strong id="mixedValue">--</strong>
          </div>
        </section>

        <section class="raw-card">
          <button class="raw-toggle" id="rawToggle" type="button">
            <span>分析详情</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <pre id="rawAnalysis" hidden>{}</pre>
        </section>
      </aside>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
