<section class="auth-view" id="authView" aria-label="认证页面" hidden>
  <div class="auth-panel">
    <div class="auth-copy">
      <div class="auth-intro">
        <div class="brand auth-brand">
          <div class="brand-mark" aria-hidden="true">
            <img class="brand-logo" src="./image/logo.png" alt="" />
          </div>
          <div>
            <h1>Emotion</h1>
          </div>
        </div>
      </div>

      <form class="fr auth-face-rating" action="" aria-label="情绪评分调节器">
        <label class="fr__label" for="face-rating">调整此刻心情</label>
        <div class="fr__face" role="img" aria-label="平静表情">
          <div class="fr__face-right-eye" data-right></div>
          <div class="fr__face-left-eye" data-left></div>
          <div class="fr__face-mouth-lower" data-mouth-lower></div>
          <div class="fr__face-mouth-upper" data-mouth-upper></div>
        </div>
        <input class="fr__input" id="face-rating" type="range" value="2.8" min="0" max="5" step="0.1" />
      </form>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist" aria-label="登录注册切换">
          <button class="auth-tab active" id="loginTab" type="button" data-auth-tab="login">登录</button>
          <button class="auth-tab" id="registerTab" type="button" data-auth-tab="register">注册</button>
        </div>

        <form class="auth-form" id="loginForm" data-auth-form="login">
          <label>
            <span>用户名</span>
            <input id="loginUsername" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <label class="check-row">
            <input id="autoLogin" type="checkbox" />
            <span>保持登录 7 天</span>
          </label>
          <button class="primary-action" id="loginButton" type="submit">进入工作台</button>
        </form>

        <form class="auth-form" id="registerForm" data-auth-form="register" hidden>
          <label>
            <span>用户名</span>
            <input id="registerUsername" autocomplete="username" required />
          </label>
          <label>
            <span>密码</span>
            <input id="registerPassword" type="password" autocomplete="new-password" required />
          </label>
          <div class="captcha-box">
            <img id="captchaImage" alt="验证码" />
            <button id="refreshCaptchaButton" type="button">换一张</button>
          </div>
          <label>
            <span>验证码</span>
            <input id="captchaCode" autocomplete="off" required />
          </label>
          <button class="primary-action" id="registerButton" type="submit">创建账号</button>
        </form>

        <p class="auth-message" id="authMessage" role="status"></p>
      </div>
    </div>
  </div>
</section>
