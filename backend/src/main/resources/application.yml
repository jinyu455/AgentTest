server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./data/emoagent.sqlite3
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

