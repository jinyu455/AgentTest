server:
  port: 8080
  
spring:  
  datasource:
    url: jdbc:sqlite:./data/emoagent.sqlite3
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

emo-agent:
  base-url: http://127.0.0.1:8000

jwt:
  secret: emoagent-jwt-secret-key-2024-must-be-at-least-32-bytes
  expiration: 86400000

admin:
  username: admin
  password: admin123
