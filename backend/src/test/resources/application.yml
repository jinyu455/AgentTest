spring:
  config:
    import: optional:file:F:/emotional_agent/database/.env[.properties]

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/emotion_agent_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

emo-agent:
  base-url: http://127.0.0.1:8000
